services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: breidablik
      POSTGRES_PASSWORD: breidablik
      POSTGRES_DB: breidablik
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breidablik"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://breidablik:breidablik@db:5432/breidablik
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
