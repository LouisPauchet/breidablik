services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: breidablik
      POSTGRES_PASSWORD: breidablik
      POSTGRES_DB: breidablik
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breidablik"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://breidablik:breidablik@db:5432/breidablik
      # Docker only: safe to keep an in-process reminder scheduler alive here since this is a
      # genuinely long-running process. Passenger deployments have no docker-compose.yml at
      # all, so this default simply doesn't apply there — they use POST /internal/cron/tick
      # via the shared host's own cron instead.
      ENABLE_INTERNAL_SCHEDULER: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
