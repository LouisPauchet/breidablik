[project]
name = "breidablik"
version = "0.5.0"
description = "Household collective manager: duties, tasks, events, shopping lists."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "fastapi-users[sqlalchemy]>=14.0",
    "pydantic-settings>=2.6",
    "pyotp>=2.9",
    "qrcode[pil]>=8.0",
    "pywebpush>=2.0",
    "icalendar>=6.1",
    "apscheduler>=3.10",
    "a2wsgi>=1.10",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
