name: Release Please

# release-please watches pushes to master, keeping a "release PR" up to date that bumps
# pyproject.toml's version and drafts a CHANGELOG entry from Conventional Commits
# (feat:/fix:/etc.) since the last release. Merging that PR is the entire release action —
# release-please then creates the tag + GitHub Release itself, and the second job below
# packages and attaches the Passenger deploy tarball to it.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Run backend test suite
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the static SPA
        working-directory: frontend
        run: |
          npm ci
          npm run generate

      - name: Package release archive
        run: |
          set -eu
          stage=dist/breidablik
          mkdir -p "$stage/frontend"
          cp -r app "$stage/app"
          find "$stage/app" -name "__pycache__" -type d -prune -exec rm -rf {} +
          cp -r frontend/.output "$stage/frontend/.output"
          cp pyproject.toml passenger_wsgi.py alembic.ini "$stage/"
          tar -czf "dist/breidablik-release.tar.gz" -C dist breidablik

      - name: Attach the deploy tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/breidablik-release.tar.gz --clobber
