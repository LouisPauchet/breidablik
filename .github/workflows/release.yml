name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
# The tag's version (after the leading "v") must match [project].version in pyproject.toml —
# bump that first, commit, then tag, so the two never drift apart.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match pyproject.toml version $project_version"
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Run backend test suite
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the static SPA
        working-directory: frontend
        run: |
          npm ci
          npm run generate

      - name: Package release archive
        run: |
          set -eu
          stage=dist/breidablik
          mkdir -p "$stage/frontend"
          cp -r app "$stage/app"
          find "$stage/app" -name "__pycache__" -type d -prune -exec rm -rf {} +
          cp -r frontend/.output "$stage/frontend/.output"
          cp pyproject.toml passenger_wsgi.py alembic.ini "$stage/"
          tar -czf "dist/breidablik-release.tar.gz" -C dist breidablik

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.version }}"
          generate_release_notes: true
          files: dist/breidablik-release.tar.gz
