name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Scratch Postgres for the migration tests only (tests/test_user_flags_migration.py): the
    # existing migrations use Postgres-only SQL, so they can't run on the SQLite the rest of
    # the suite uses.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run backend test suite
        run: uv run pytest -q
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MIGRATION_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/migtest"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build the static SPA
        run: npm run generate
